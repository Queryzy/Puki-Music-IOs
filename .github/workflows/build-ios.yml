name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Xcode Project via xcodegen
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml

      - name: Build IPA (Ad-Hoc / Unsigned for SideStore & Sideloadly)
        run: |
          xcodebuild clean archive \
            -project PukiMusic.xcodeproj \
            -scheme PukiMusic \
            -configuration Release \
            -archivePath build/PukiMusic.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p build/Payload
          cp -r build/PukiMusic.xcarchive/Products/Applications/PukiMusic.app build/Payload/
          cd build && zip -r Puki-Music.ipa Payload
          echo "IPA Build complete: build/Puki-Music.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Puki-Music-iOS-IPA
          path: build/Puki-Music.ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.24
          name: "Puki Music iOS v1.0.24"
          body: |
            ## Puki Music iOS Native (SwiftUI) v1.0.24
            - **Lyrics Timing Offset Sync Adjuster (Option A)**: Quick stepper buttons `[-0.5s] [-0.1s] [0.0s] [+0.1s] [+0.5s]` with real-time feedback and per-track persistence.
            - **O(1) Active Lyric Matching**: Replaced O(N^2) linear searching inside ForEach with instant identifier equality.
            - **Performance & Battery Optimization**: Throttled MPNowPlayingInfoCenter updates from 10Hz to 1Hz, saving CPU and battery during playback.
          files: build/Puki-Music.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


