name: PukiMusic
options:
  bundleIdPrefix: com.puki.music
  xcodeVersion: "15.4"
targets:
  PukiMusic:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [PukiMusic]
    info:
      path: PukiMusic/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.puki.music.ios
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
      ENABLE_BITCODE: NO
      SWIFT_VERSION: "5.0"
      INFOPLIST_FILE: PukiMusic/Info.plist
      TARGETED_DEVICE_FAMILY: "1" # iPhone only

