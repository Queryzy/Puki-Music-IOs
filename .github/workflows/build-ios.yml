name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Xcode Project via xcodegen
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml

      - name: Build IPA (Ad-Hoc / Unsigned for SideStore & Sideloadly)
        run: |
          xcodebuild clean archive \
            -project PukiMusic.xcodeproj \
            -scheme PukiMusic \
            -configuration Release \
            -archivePath build/PukiMusic.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p build/Payload
          cp -r build/PukiMusic.xcarchive/Products/Applications/PukiMusic.app build/Payload/
          cd build && zip -r Puki-Music.ipa Payload
          echo "IPA Build complete: build/Puki-Music.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Puki-Music-iOS-IPA
          path: build/Puki-Music.ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.21
          name: "Puki Music iOS v1.0.21"
          body: |
            ## Puki Music iOS Native (SwiftUI) v1.0.21
            - **100% Native Artwork Renderer (No AsyncImage)**: Replaced every single AsyncImage across all screens (Home, Albums, Search, Queues, FullPlayer, Playlists) with lightweight `PukiArtworkImage`.
            - **Lockscreen & Player Parity**: Unified cover image caching and local fallback via `UIImage(contentsOfFile:)` and URLSession with Safari User-Agent.
            - **Lightweight Memory Management**: Pure `NSCache` memory caching with low overhead.
          files: build/Puki-Music.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


