name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Xcode Project via xcodegen
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml


      - name: Build IPA (Ad-Hoc / Unsigned for SideStore & Sideloadly)
        run: |
          xcodebuild clean archive \
            -project PukiMusic.xcodeproj \
            -scheme PukiMusic \
            -configuration Release \
            -archivePath build/PukiMusic.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p build/Payload
          cp -r build/PukiMusic.xcarchive/Products/Applications/PukiMusic.app build/Payload/
          cd build && zip -r Puki-Music.ipa Payload
          echo "IPA Build complete: build/Puki-Music.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Puki-Music-iOS-IPA
          path: build/Puki-Music.ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.5
          name: "Puki Music iOS v1.0.5"
          body: |
            ## Puki Music iOS Native (SwiftUI) v1.0.5
            - **Background Audio & Lockscreen Controls**: Continuous background playback when app is minimized or notification shade is pulled down. Full MPRemoteCommandCenter and lockscreen media art integration.
            - **Realtime Lyrics Sync**: Lyrics auto-scroll and highlight matching playback time.
            - **Playlist, Favorites, & Offline UI**: Create and manage local playlists, save favorites, and manage storage.
            - **UI Polish**: Album sheet presentation avoids mini-player collision; bottom navigation bar aligned to standard iOS safe margins.
            - **Branding**: Official Puki Music logo added to Home Header.
            - **Changelog & Cache Cleaner**: Added in-app release notes dialog and disk space cleaner.
          files: build/Puki-Music.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


