name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Xcode Project via xcodegen
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml


      - name: Build IPA (Ad-Hoc / Unsigned for SideStore & Sideloadly)
        run: |
          xcodebuild clean archive \
            -project PukiMusic.xcodeproj \
            -scheme PukiMusic \
            -configuration Release \
            -archivePath build/PukiMusic.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p build/Payload
          cp -r build/PukiMusic.xcarchive/Products/Applications/PukiMusic.app build/Payload/
          cd build && zip -r Puki-Music.ipa Payload
          echo "IPA Build complete: build/Puki-Music.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Puki-Music-iOS-IPA
          path: build/Puki-Music.ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.14
          name: "Puki Music iOS v1.0.14"
          body: |
            ## Puki Music iOS Native (SwiftUI) v1.0.14
            - **Dual Search Engine (1:1 Android)**: Parallel YouTube Music & Deezer search; accurate Indonesian/local tracks (Noah, Peterpan, dll).
            - **Smart Fallback Downloader**: Multi-query sanitize and direct YouTube video resolver for imported playlists.
            - **Official & Popular Badges**: Added `💿 OFFICIAL • HD` and `🔥 POPULER` badges across all lists.
            - **Playlist Artwork**: Added high-res thumbnail covers in playlist tracks view.
          files: build/Puki-Music.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


