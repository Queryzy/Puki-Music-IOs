name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Version
        id: get_version
        run: |
          VERSION=$(grep 'MARKETING_VERSION:' project.yml | awk '{print $2}' | tr -d '"')
          BUILD=$(grep 'CURRENT_PROJECT_VERSION:' project.yml | awk '{print $2}' | tr -d '"')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build=${BUILD}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Create Xcode Project via xcodegen
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml

      - name: Build IPA (Ad-Hoc / Unsigned for SideStore & Sideloadly)
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          BUILD="${{ steps.get_version.outputs.build }}"
          
          xcodebuild clean archive \
            -project PukiMusic.xcodeproj \
            -scheme PukiMusic \
            -configuration Release \
            -archivePath build/PukiMusic.xcarchive \
            MARKETING_VERSION="${VERSION}" \
            CURRENT_PROJECT_VERSION="${BUILD}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p build/Payload
          cp -r build/PukiMusic.xcarchive/Products/Applications/PukiMusic.app build/Payload/
          
          # Force Plist to exact target version so SideStore parser matches 100%
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION}" build/Payload/PukiMusic.app/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string ${VERSION}" build/Payload/PukiMusic.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD}" build/Payload/PukiMusic.app/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${BUILD}" build/Payload/PukiMusic.app/Info.plist
          
          cd build && zip -r Puki-Music.ipa Payload
          echo "IPA Build complete: build/Puki-Music.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Puki-Music-iOS-IPA
          path: build/Puki-Music.ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: "Puki Music iOS ${{ steps.get_version.outputs.tag }}"
          body: |
            ## Puki Music iOS Native (SwiftUI) ${{ steps.get_version.outputs.tag }}
            - **SideStore Auto-Update Repository**: Added community source format `apps.json` for 1-click updates in SideStore.
            - **Dynamic App Versioning**: Displaying real marketing version and build number in Settings.
            - **LRC Timing Offset Adjuster**: Interactive real-time lyric sync stepper bar `[-0.5s] [-0.1s] [0.0s] [+0.1s] [+0.5s]`.
            - **O(1) Lyric Active Match & 1Hz Remote Throttling**: Peak performance with zero UI stutter.
          files: build/Puki-Music.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update SideStore apps.json
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        run: |
          python3 -c "
          import json, datetime, os, hashlib
          ver = '${{ steps.get_version.outputs.version }}'
          tag = '${{ steps.get_version.outputs.tag }}'
          now_iso = datetime.datetime.now(datetime.timezone.utc).isoformat()
          
          ipa_path = 'build/Puki-Music.ipa'
          ipa_size = os.path.getsize(ipa_path) if os.path.exists(ipa_path) else 1571277
          ipa_sha256 = ''
          if os.path.exists(ipa_path):
              with open(ipa_path, 'rb') as f_ipa:
                  ipa_sha256 = hashlib.sha256(f_ipa.read()).hexdigest()
          
          try:
              with open('apps.json', 'r') as f:
                  data = json.load(f)
              
              ipa_url = f'https://github.com/Queryzy/Puki-Music-IOs/releases/download/{tag}/Puki-Music.ipa'
              app = data['apps'][0]
              versions = app.get('versions', [])
              
              existing = [v for v in versions if v.get('version') == ver]
              if not existing:
                  new_ver = {
                      'version': ver,
                      'date': now_iso,
                      'localizedDescription': f'Puki Music iOS {tag} Release Update',
                      'downloadURL': ipa_url,
                      'size': ipa_size,
                      'sha256': ipa_sha256,
                      'minOSVersion': '16.0'
                  }
                  versions.insert(0, new_ver)
                  app['versions'] = versions[:10]
              else:
                  existing[0]['downloadURL'] = ipa_url
                  existing[0]['date'] = now_iso
                  existing[0]['size'] = ipa_size
                  existing[0]['sha256'] = ipa_sha256
              
              app['size'] = ipa_size
              app['version'] = ver
              app['versionDate'] = now_iso
              app['downloadURL'] = ipa_url
              
              with open('apps.json', 'w') as f:
                  json.dump(data, f, indent=2)
              print(f'Successfully updated apps.json for {tag} with size {ipa_size}')
          except Exception as e:
              print(f'Failed to update apps.json: {e}')
          "
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add apps.json
          git commit -m "chore(repo): update apps.json to ${{ steps.get_version.outputs.tag }} [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push skipped or not needed"


