name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Xcode Project via xcodegen
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml


      - name: Build IPA (Ad-Hoc / Unsigned for SideStore & Sideloadly)
        run: |
          xcodebuild clean archive \
            -project PukiMusic.xcodeproj \
            -scheme PukiMusic \
            -configuration Release \
            -archivePath build/PukiMusic.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p build/Payload
          cp -r build/PukiMusic.xcarchive/Products/Applications/PukiMusic.app build/Payload/
          cd build && zip -r Puki-Music.ipa Payload
          echo "IPA Build complete: build/Puki-Music.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Puki-Music-iOS-IPA
          path: build/Puki-Music.ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.10
          name: "Puki Music iOS v1.0.10"
          body: |
            ## Puki Music iOS Native (SwiftUI) v1.0.10
            - **Audio Silence Fix**: Removed forced video track muting on itag 18 stream. Pure audio playback restored with zero loss and 100% stable CoreAudio volume.
            - **Multi-Query Offline Downloader 1:1 Android**: Added 4-tier query fallback resolver with duration tolerance matching and cached Deezer-to-YouTube mapping.
            - **Realtime Download Percentage Indicator**: Added animated progress rings with exact percentage number badge across all track rows, album sheets, and full player.
            - **Synchronized Lyrics Engine 1:1**: Implemented multi-query LRCLIB matching, title cleaning, duration tolerance filtering, dynamic track-switch reloading, and tap-to-seek support.
            - **Full Retina HD Artwork**: Upgraded Deezer covers and artist portraits to 1000x1000 (`cover_xl`, `picture_xl`) and YouTube thumbnails to `maxresdefault.jpg`.
          files: build/Puki-Music.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


