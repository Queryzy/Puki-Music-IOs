name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Xcode Project via xcodegen
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml


      - name: Build IPA (Ad-Hoc / Unsigned for SideStore & Sideloadly)
        run: |
          xcodebuild clean archive \
            -project PukiMusic.xcodeproj \
            -scheme PukiMusic \
            -configuration Release \
            -archivePath build/PukiMusic.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p build/Payload
          cp -r build/PukiMusic.xcarchive/Products/Applications/PukiMusic.app build/Payload/
          cd build && zip -r Puki-Music.ipa Payload
          echo "IPA Build complete: build/Puki-Music.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Puki-Music-iOS-IPA
          path: build/Puki-Music.ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.9
          name: "Puki Music iOS v1.0.9"
          body: |
            ## Puki Music iOS Native (SwiftUI) v1.0.9 (1:1 Android Parity)
            - **Volume Stability Fix**: Disabled dynamic range compression and locked `allowedAudioSpatializationFormats = .monauralOnly`, `audioTimePitchAlgorithm = .spectral`, and `player.volume = 1.0`. Eliminates audio pumping/ducking.
            - **Resilient Offline Downloader**: In-app download engine with iOS background task extension (`UIApplication.beginBackgroundTask`) and dynamic relative manifest resolution.
            - **3-State Download Indicators**: Clear visual statuses across Home, Search, and Library: Gray (not downloaded), Amber spinner (downloading), and Green solid checkmark with OFFLINE tag (saved to disk).
            - **Standard Previous Button**: Restarts track to 0:00 if playback duration > 3 seconds, jumps to previous track in queue if under 3 seconds.
            - **Non-blocking Navigation**: Switching tabs immediately clears detail sheets so users never get locked out of menus.
            - **Behavior Feed Integration**: Connected imported `play_history` to Home dashboard (Top Favorite Artists carousel & Frequently Played section).
            - **Proportional HD Player UI**: 1000x1000 high-res cover art upscaler, minimal circular 10pt scrubber thumb, balanced vertical rhythm, and studio quality status badge.
          files: build/Puki-Music.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


