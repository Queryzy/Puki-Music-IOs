name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Xcode Project via xcodegen
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml


      - name: Build IPA (Ad-Hoc / Unsigned for SideStore & Sideloadly)
        run: |
          xcodebuild clean archive \
            -project PukiMusic.xcodeproj \
            -scheme PukiMusic \
            -configuration Release \
            -archivePath build/PukiMusic.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p build/Payload
          cp -r build/PukiMusic.xcarchive/Products/Applications/PukiMusic.app build/Payload/
          cd build && zip -r Puki-Music.ipa Payload
          echo "IPA Build complete: build/Puki-Music.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Puki-Music-iOS-IPA
          path: build/Puki-Music.ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.3
          name: "Puki Music iOS v1.0.3"
          body: |
            ## Puki Music iOS Native (SwiftUI) v1.0.3
            - **Target**: iPhone 12 Pro Max / iOS 16+
            - **Full Screen Edge-to-Edge**: Fixed letterboxing (no more top & bottom black gaps). Full screen layout!
            - **Official App Icon**: Bundled 1024x1024 high-resolution Puki Music icon with midnight glow badge.
            - **Audio Engine**: Instant audio playback with zero-second fallback, dynamic buffering indicators, and fixed play/pause toggles.
            - **Search**: Added album search results and filter tabs (Semua, Lagu, Album).
            - **Frosted Glass UI**: Ultra-thin material blur navigation bar with ambient glow shadows on cards.
          files: build/Puki-Music.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


