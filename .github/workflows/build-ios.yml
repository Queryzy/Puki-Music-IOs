name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Xcode Project via xcodegen
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml


      - name: Build IPA (Ad-Hoc / Unsigned for SideStore & Sideloadly)
        run: |
          xcodebuild clean archive \
            -project PukiMusic.xcodeproj \
            -scheme PukiMusic \
            -configuration Release \
            -archivePath build/PukiMusic.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p build/Payload
          cp -r build/PukiMusic.xcarchive/Products/Applications/PukiMusic.app build/Payload/
          cd build && zip -r Puki-Music.ipa Payload
          echo "IPA Build complete: build/Puki-Music.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Puki-Music-iOS-IPA
          path: build/Puki-Music.ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.8
          name: "Puki Music iOS v1.0.8"
          body: |
            ## Puki Music iOS Native (SwiftUI) v1.0.8 (1:1 Android Parity)
            - **Background Audio Kernel Fix**: Declared `UIBackgroundModes: [audio, fetch]` directly in `project.yml` XcodeGen properties. Audio plays uninterrupted on screen lock, notification shade pull, and app switching.
            - **Real Background Download Engine**: Native `URLSessionDownloadDelegate` with background daemon routing. Downloads persist when app is suspended or killed, saving directly to offline folder with manifest tracking.
            - **Android JSON Import Parity**: Full restoration of `recent_searches` and `play_history` (behavior) from Android backup file.
            - **Expanded Player Controls 1:1**: Added Repeat Modes Cycle (OFF/ALL/ONE), Shuffle / Mix Play, and 3-mode segmented switcher [Cover | Lirik | Antrean].
            - **Non-blocking In-line UI**: Replaced modal sheets for Album & Playlist details with in-line navigation stack. Mini player and bottom navigation bar remain visible and accessible.
          files: build/Puki-Music.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


